const Field=({id,label,err,children})=>html`<div><label for=${id} class="block font-semibold mb-1.5">${label}</label>${children}${err&&html`<p id=${id+"e"} role="alert" class="mt-1.5 text-sm text-[#FFB59B]">${err}</p>`}</div>`;
const CATS=["Scolaire","Bureau","Informatique","Entretien","Autre"];
const inp="w-full rounded-xl bg-white/10 border border-white/40 px-4 py-3 text-white placeholder-white/60";

function Form(){
  const [v,sv]=useState({n:"",t:"",b:"",l:"",c:[]}), [e,se]=useState({}), [link,sl]=useState("");
  const set=k=>ev=>sv({...v,[k]:ev.target.value});
  const submit=ev=>{
    ev.preventDefault(); const x={};
    if(v.n.trim().length<2)x.n="Indiquez votre nom.";
    if(v.t.replace(/\D/g,"").length<8)x.t="Entrez un numéro valide (8 chiffres minimum).";
    if(!v.b)x.b="Choisissez une boutique.";
    if(v.l.trim().length<5&&!v.c.length)x.l="Décrivez votre liste ou choisissez un rayon.";
    se(x); if(Object.keys(x).length)return;
    const u=wa(`Bonjour LVB, je suis ${v.n.trim()} (${v.t.trim()}). Boutique choisie : ${v.b}. Je cherche : ${v.c.join(", ")||"non précisé"}. Ma liste : ${v.l.trim()||"à préciser sur WhatsApp"}`);
    sl(u); window.open(u,"_blank","noopener");
  };
  const a=k=>({"aria-invalid":!!e[k],"aria-describedby":e[k]?k+"e":undefined});
  return html`<form onSubmit=${submit} noValidate class="grid gap-5">
    <${Field} id="n" label="Votre nom" err=${e.n}><input id="n" class=${inp} autocomplete="name" value=${v.n} onChange=${set("n")} ...${a("n")}/><//>
    <${Field} id="t" label="Votre téléphone" err=${e.t}><input id="t" type="tel" inputmode="tel" class=${inp} autocomplete="tel" placeholder="+229 …" value=${v.t} onChange=${set("t")} ...${a("t")}/><//>
    <${Field} id="b" label="Boutique la plus proche" err=${e.b}><select id="b" class=${inp+" [&>option]:text-[#1C1A1A]"} value=${v.b} onChange=${set("b")} ...${a("b")}><option value="">Choisir…</option>${SHOPS.map(s=>html`<option key=${s[0]} value=${s[0]+" "+s[1]}>${s[0]} – ${s[1]}</option>`)}</select><//>
    <fieldset><legend class="font-semibold mb-2">Vous cherchez (facultatif)</legend><div class="flex flex-wrap gap-2">${CATS.map(c=>html`<button type="button" key=${c} aria-pressed=${v.c.includes(c)} onClick=${()=>sv({...v,c:v.c.includes(c)?v.c.filter(x=>x!==c):[...v.c,c]})} class=${"rounded-full border px-4 min-h-[44px] text-sm font-semibold transition "+(v.c.includes(c)?"bg-ye text-[#1C1A1A] border-ye":"border-white/40 text-white hover:bg-white/10")}>${c}</button>`)}</div></fieldset>
    <${Field} id="l" label="Votre liste de fournitures" err=${e.l}><textarea id="l" rows="4" class=${inp} value=${v.l} onChange=${set("l")} ...${a("l")}></textarea><//>
    <button type="submit" class="rounded-full bg-ye text-[#1C1A1A] font-bold px-6 py-4 transition hover:-translate-y-0.5 hover:shadow-lg">Envoyer ma liste sur WhatsApp</button>
    <p class="text-sm text-white/75" aria-live="polite">${link?html`WhatsApp s’ouvre avec votre message prêt. Il n’est envoyé que lorsque vous appuyez sur Envoyer là-bas. <a class="underline" href=${link} target="_blank" rel="noopener">WhatsApp ne s’est pas ouvert ?</a>`:"Rien n’est enregistré sur ce site : votre message passe uniquement par WhatsApp."}</p>
  </form>`;
}

function App(){
